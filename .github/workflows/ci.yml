name: Test

on:
    pull_request:
        branches: [main]
    # The release workflow calls this, and publishes only once it passes on the pushed commit.
    workflow_call:

# Only a single workflow will run at a time. Cancel any in-progress run.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24, 26]

        env:
            NODE_ENV: test
            CI: true

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run type checks
              run: npm run type-check

            - name: Run unit tests
              run: npm run test

            - name: Run linting and formatting checks
              run: npm run format:check
